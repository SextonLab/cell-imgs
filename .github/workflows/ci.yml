name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the cellpose install to a sane size; no test
          # in the suite needs a GPU or model weights.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check cellimgs tests

      - name: Test
        run: pytest -q

      - name: Check console scripts are importable
        run: |
          for cmd in gen-masks convert-c01 max-proj cmerge smashtif \
                     stack-imgs align-images get-imgcounts get-wellcounts; do
            echo "--- $cmd"
            $cmd --help > /dev/null
          done
